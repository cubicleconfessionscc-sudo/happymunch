<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HappyMunch — Employee Web App</title>
<meta name="description" content="Pre-order cafeteria food, pay securely with UPI (GPay · PhonePe · Paytm), pick a pickup slot and skip the queue." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --primary: #4f46e5; --primary-2: #7c3aed; --accent: #f97316;
    --ok: #10b981; --bad: #ef4444; --amber: #f59e0b;
    --bg: #0b1020; --card: #ffffff; --surface: #f5f7ff;
    --text: #0f172a; --muted: #64748b; --line: #e6e9f5;
    --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #a855f7 100%);
    --grad-warm: linear-gradient(135deg, #f97316, #fb923c);
    --shadow: 0 10px 30px -12px rgba(79,70,229,.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #312e81 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 10%, #7c3aed33 0%, transparent 50%),
      #0b1020;
    color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea { font-family: inherit; }

  #app {
    width: 100%; max-width: 460px; min-height: 100vh; background: var(--surface);
    display: flex; flex-direction: column; position: relative; overflow-x: hidden;
  }
  @media (min-width: 520px) {
    #app { margin: 20px 0; min-height: auto; border-radius: 30px; overflow: hidden;
      box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); border: 1px solid #ffffff14; }
  }

  .view { flex: 1; display: none; flex-direction: column; animation: fade .3s ease; }
  .view.active { display: flex; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 16px;
    background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
  }
  .topbar .back { font-size: 22px; color: var(--primary); font-weight: 800; padding: 2px 8px; }
  .topbar h2 { font-size: 17px; font-weight: 800; flex: 1; letter-spacing: -.3px; }
  .topbar .mini { font-size: 12.5px; color: var(--muted); font-weight: 600; }

  /* ---------- LOGIN ---------- */
  #view-login { background:
      radial-gradient(700px 380px at 50% -8%, #4f46e5 0%, transparent 60%),
      linear-gradient(180deg, #1e1b4b 0%, #0b1020 100%);
    justify-content: center; padding: 30px 24px; color: #fff; }
  .logo-big {
    width: 84px; height: 84px; border-radius: 26px; margin: 0 auto 18px;
    display: grid; place-items: center; font-size: 44px; background: var(--grad);
    box-shadow: 0 20px 45px -12px rgba(124,58,237,.8); animation: pop .5s ease;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  .app-name { text-align: center; font-size: 32px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(90deg,#fff,#c7d2fe); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .app-sub { text-align: center; font-size: 13.5px; color: #c7d2fe; margin: 7px 0 28px; }
  .glass { background: #ffffff10; border: 1px solid #ffffff22; border-radius: 18px; padding: 18px; backdrop-filter: blur(12px); }
  .label { font-size: 12.5px; font-weight: 700; color: #e0e7ff; margin: 12px 0 6px; display: block; text-transform: uppercase; letter-spacing: .5px; }
  .input {
    width: 100%; border: 1.5px solid #ffffff26; border-radius: 13px; padding: 14px;
    font-size: 15.5px; background: #ffffff0f; color: #fff; outline: none; transition: .15s;
  }
  .input::placeholder { color: #ffffff70; }
  .input:focus { border-color: #a5b4fc; background: #ffffff1a; }
  .btn-main {
    width: 100%; background: var(--grad); color: #fff; font-size: 16px; font-weight: 800;
    padding: 16px; border-radius: 14px; margin-top: 20px; box-shadow: var(--shadow);
    transition: transform .1s, filter .15s; letter-spacing: .2px;
  }
  .btn-main:hover { filter: brightness(1.08); }
  .btn-main:active { transform: scale(.98); }
  .btn-main:disabled { opacity: .6; cursor: not-allowed; }
  .demo-hint { text-align: center; font-size: 12px; color: #c7d2fe; margin-top: 18px; line-height: 1.8; }
  .demo-hint code { background: #ffffff1a; padding: 2px 8px; border-radius: 7px; color: #fff; }
  .err-box { background: #ef444426; border: 1px solid #ef444466; color: #fecaca; font-size: 13px; padding: 11px 13px; border-radius: 11px; margin-top: 14px; display: none; }

  /* ---------- HOME ---------- */
  #view-home { padding-bottom: 76px; }
  .home-hero {
    margin: 14px 14px 6px; padding: 20px; border-radius: 22px; color: #fff;
    background: var(--grad); box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .home-hero::after { content: "🍔"; position: absolute; right: -6px; bottom: -14px; font-size: 92px; opacity: .22; transform: rotate(-12deg); }
  .home-hero h1 { font-size: 22px; font-weight: 900; letter-spacing: -.5px; }
  .home-hero p { font-size: 13px; color: #e0e7ff; margin-top: 4px; }
  .chip-row { display: flex; gap: 8px; margin: 12px 14px 4px; }
  .chip { background: #fff; color: var(--primary); font-weight: 700; font-size: 12.5px; padding: 9px 14px;
    border-radius: 30px; border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(15,23,42,.05); }
  .sec-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 14px 18px 4px; }
  .vendor-card {
    background: #fff; border-radius: 18px; margin: 8px 14px; padding: 15px;
    display: flex; align-items: center; gap: 13px; border: 1px solid var(--line);
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .vendor-card:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -12px rgba(15,23,42,.25); }
  .vendor-emoji { width: 50px; height: 50px; border-radius: 15px; background: linear-gradient(135deg,#fef3c7,#fde68a);
    display: grid; place-items: center; font-size: 26px; flex-shrink: 0; box-shadow: inset 0 0 0 1px #0000000d; }
  .vendor-info { flex: 1; }
  .vendor-info b { font-size: 15.5px; display: block; letter-spacing: -.2px; }
  .vendor-info span { font-size: 12.5px; color: var(--muted); }
  .badge-ok { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; color: var(--ok); margin-top: 6px;
    background: #10b9811a; padding: 3px 8px; border-radius: 20px; }
  .badge-ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .go { color: #cbd5e1; font-size: 26px; font-weight: 800; }
  .signout { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--primary); font-weight: 800; font-size: 13.5px; padding: 10px; }

  /* ---------- MENU ---------- */
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; padding: 13px 13px 96px; }
  @media (max-width: 380px) { .menu-grid { grid-template-columns: 1fr; } }
  .food-card { background: #fff; border: 1px solid var(--line); border-radius: 17px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .12s, box-shadow .12s; }
  .food-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -14px rgba(15,23,42,.3); }
  .food-img { height: 94px; display: grid; place-items: center; font-size: 42px;
    background: linear-gradient(135deg,#eef2ff,#fae8ff); }
  .food-body { padding: 11px 12px 13px; display: flex; flex-direction: column; flex: 1; }
  .food-body b { font-size: 13.5px; line-height: 1.3; letter-spacing: -.2px; }
  .food-body .fdesc { font-size: 11px; color: var(--muted); margin-top: 3px; flex: 1; line-height: 1.4; }
  .food-row { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
  .price { font-weight: 900; color: var(--primary); font-size: 15px; }
  .add-btn { background: var(--grad); color: #fff; width: 30px; height: 30px; border-radius: 11px; font-size: 19px; font-weight: 800; line-height: 1;
    box-shadow: 0 6px 14px -6px rgba(79,70,229,.7); transition: transform .1s; }
  .add-btn:active { transform: scale(.88); }
  .unavail { opacity: .45; pointer-events: none; }

  .cart-bar {
    position: fixed; bottom: 0; width: 100%; max-width: 460px; margin: 0 auto;
    background: var(--grad); color: #fff; display: none; align-items: center; justify-content: space-between;
    padding: 15px 20px; cursor: pointer; z-index: 20; box-shadow: 0 -8px 24px -8px rgba(79,70,229,.5);
  }
  @media (min-width: 520px) { .cart-bar { position: sticky; border-radius: 0 0 30px 30px; } }
  .cart-bar.show { display: flex; }
  .cart-bar .cb-l { font-weight: 800; font-size: 15px; }
  .cart-bar .cb-r { font-weight: 900; font-size: 16px; background: #ffffff2a; padding: 6px 12px; border-radius: 10px; }

  /* ---------- CART ---------- */
  .cart-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #f1f5f9; background: #fff; }
  .cart-row .ci { flex: 1; }
  .cart-row .ci b { font-size: 14.5px; display: block; }
  .qty-box { display: inline-flex; align-items: center; gap: 10px; margin-top: 6px; }
  .qty-box button { width: 24px; height: 24px; border-radius: 8px; background: #eef2ff; color: var(--primary); font-weight: 900; font-size: 15px; }
  .qty-box span { font-size: 13.5px; font-weight: 800; min-width: 16px; text-align: center; }
  .cart-price { font-weight: 900; color: var(--primary); font-size: 14.5px; }
  .rm-btn { color: var(--bad); font-size: 11.5px; font-weight: 800; }
  .notes-wrap { padding: 14px 16px; }
  .notes-wrap textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; min-height: 70px; resize: vertical; outline: none; background: #fff; }
  .notes-wrap textarea:focus { border-color: var(--primary); }
  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 16px; background: #fff; border-top: 1px solid var(--line); }
  .total-row .tl { font-size: 15px; font-weight: 700; }
  .total-row .tv { font-size: 20px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- ORDER / SLOTS ---------- */
  .slot-day { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; padding: 12px 16px 0; }
  .slots-wrap { display: flex; gap: 9px; overflow-x: auto; padding: 11px 14px; }
  .slot { background: #fff; border: 1.5px solid var(--line); border-radius: 13px; padding: 12px 14px;
    min-width: 108px; text-align: center; flex-shrink: 0; cursor: pointer; transition: .12s; }
  .slot b { font-size: 15px; display: block; }
  .slot span { font-size: 11.5px; color: var(--muted); }
  .slot.sel { background: var(--grad); border-color: transparent; box-shadow: var(--shadow); }
  .slot.sel b, .slot.sel span { color: #fff; }
  .slot.full { opacity: .4; cursor: not-allowed; }

  /* ---------- PAYMENT SHEET ---------- */
  .pay-sheet { margin: 14px; border-radius: 22px; overflow: hidden; box-shadow: 0 20px 44px -20px rgba(15,23,42,.4); }
  .pay-head { background: var(--grad); color: #fff; padding: 18px 18px 16px; }
  .pay-head .amt { font-size: 30px; font-weight: 900; letter-spacing: -1px; }
  .pay-head .who { font-size: 13px; color: #e0e7ff; margin-top: 2px; }
  .pay-body { background: #fff; padding: 16px; }
  .pay-note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .pay-to { display: flex; align-items: center; gap: 10px; background: #f8fafc; border: 1px dashed var(--line); border-radius: 12px; padding: 11px 12px; margin-bottom: 14px; }
  .pay-to .pt-ico { font-size: 20px; }
  .pay-to b { font-size: 13.5px; display: block; }
  .pay-to span { font-size: 12px; color: var(--muted); word-break: break-all; }
  .pay-apps { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
  .pay-app { border-radius: 13px; padding: 13px 6px; text-align: center; font-weight: 800; font-size: 12px; color: #fff; transition: transform .1s, filter .15s; }
  .pay-app:hover { filter: brightness(1.07); }
  .pay-app:active { transform: scale(.96); }
  .pay-app .ico { font-size: 22px; display: block; margin-bottom: 5px; }
  .pa-gpay { background: linear-gradient(135deg,#1a73e8,#4285f4); }
  .pa-phonepe { background: linear-gradient(135deg,#5f259f,#7b2ff7); }
  .pa-paytm { background: linear-gradient(135deg,#00baf2,#26a5e4); }
  .pa-more { background: linear-gradient(135deg,#334155,#475569); grid-column: 1/-1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; }
  .pay-qr { text-align: center; margin-top: 14px; }
  .pay-qr .qrbox { display: inline-block; background: #fff; padding: 10px; border-radius: 14px; border: 1px solid var(--line); }
  .pay-qr p { font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .paid-btn { width: 100%; margin-top: 14px; background: linear-gradient(135deg,#10b981,#059669); color: #fff; font-weight: 800;
    font-size: 15px; padding: 15px; border-radius: 13px; box-shadow: 0 10px 22px -10px rgba(16,185,129,.7); }
  .paid-btn:active { transform: scale(.98); }
  .cancel-link { display: block; text-align: center; color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 11px; }

  /* ---------- SUCCESS ---------- */
  .success-card { background: #fff; border-radius: 22px; padding: 26px 20px; margin: 16px 14px; text-align: center;
    box-shadow: 0 20px 44px -22px rgba(16,185,129,.5); border: 1px solid #d1fae5; }
  .success-card .tick { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg,#10b981,#059669);
    color: #fff; font-size: 34px; display: grid; place-items: center; margin: 0 auto 12px; box-shadow: 0 12px 26px -10px rgba(16,185,129,.8); }
  .success-card h3 { color: #065f46; font-size: 21px; font-weight: 900; }
  .success-card .oid { font-size: 18px; font-weight: 900; color: var(--primary); margin: 8px 0 3px; }
  .success-card p { font-size: 13px; color: var(--muted); }
  #qr-box { display: flex; justify-content: center; margin: 15px 0 4px; }
  #qr-box img, #qr-box canvas { border-radius: 8px; }
  .btn-done { background: var(--grad); color: #fff; font-weight: 800; padding: 12px 28px; border-radius: 12px; margin-top: 14px; font-size: 15px; box-shadow: var(--shadow); }

  /* ---------- HISTORY ---------- */
  .order-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; margin: 9px 14px; padding: 14px;
    display: flex; justify-content: space-between; align-items: center; }
  .order-card .oc { flex: 1; }
  .order-card .oc b { font-size: 15px; }
  .order-card .oc span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .order-card .oc em { display: block; font-style: normal; font-size: 11.5px; color: #94a3b8; margin-top: 3px; }
  .status-pill { font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 9px; background: #f1f5f9; white-space: nowrap; }
  .paid-tag { display: inline-block; font-size: 10px; font-weight: 800; color: #065f46; background: #d1fae5; padding: 2px 7px; border-radius: 6px; margin-top: 5px; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 48px 20px; }
  .empty .big { font-size: 44px; display: block; margin-bottom: 10px; }
  .spinner { width: 34px; height: 34px; border: 4px solid #e0e7ff; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader { display: none; position: absolute; inset: 0; background: #ffffffaa; z-index: 40; place-items: center; backdrop-filter: blur(2px); }
  .loader.show { display: grid; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #0f172a; color: #fff; font-size: 13.5px; font-weight: 600; padding: 12px 20px;
    border-radius: 12px; opacity: 0; transition: all .25s; z-index: 99; max-width: 90vw; text-align: center; box-shadow: 0 12px 30px -10px rgba(0,0,0,.6); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- ================= LOGIN ================= -->
  <div class="view active" id="view-login">
    <div class="logo-big">🍔</div>
    <div class="app-name">HappyMunch</div>
    <div class="app-sub">Pre-order · Pay with UPI · Skip the queue</div>
    <div class="glass">
      <label class="label">Employee ID</label>
      <input class="input" id="login-id" placeholder="e.g. EMP-0001" autocapitalize="characters" autocomplete="off" />
      <label class="label">Password</label>
      <input class="input" id="login-pw" type="password" placeholder="••••••••" autocomplete="off" />
      <div class="err-box" id="login-err"></div>
      <button class="btn-main" id="login-btn" onclick="doLogin()">Sign In</button>
    </div>
    <div class="demo-hint">Demo — <code>EMP-0001</code> / <code>Emp@12345</code></div>
  </div>

  <!-- ================= HOME ================= -->
  <div class="view" id="view-home">
    <div class="home-hero">
      <h1 id="hello">Hello</h1>
      <p>What are you munching today?</p>
    </div>
    <div class="chip-row">
      <button class="chip" onclick="go('history')">📋 My Orders</button>
      <button class="chip" onclick="loadVendors(true)">↻ Refresh</button>
    </div>
    <div class="sec-title">Approved vendors</div>
    <div id="vendors-list"></div>
    <button class="signout" onclick="logout()">Sign Out</button>
  </div>

  <!-- ================= MENU ================= -->
  <div class="view" id="view-menu">
    <div class="topbar">
      <button class="back" onclick="go('home')">‹</button>
      <h2 id="menu-vendor-name">Menu</h2>
      <span class="mini" id="menu-vendor-loc"></span>
    </div>
    <div class="menu-grid" id="menu-grid"></div>
    <button class="cart-bar" id="cart-bar" onclick="go('cart')">
      <span class="cb-l">🛒 View Cart (<span id="cart-count">0</span>)</span>
      <span class="cb-r" id="cart-total">₹0.00</span>
    </button>
  </div>

  <!-- ================= CART ================= -->
  <div class="view" id="view-cart">
    <div class="topbar">
      <button class="back" onclick="go('menu')">‹</button>
      <h2>Your Cart</h2>
      <span class="mini" id="cart-item-n">0 item(s)</span>
    </div>
    <div id="cart-list"></div>
    <div class="notes-wrap">
      <label class="label" style="color:var(--text)">Special instructions</label>
      <textarea id="order-notes" placeholder="e.g. less spicy, no onion"></textarea>
    </div>
    <div class="total-row">
      <span class="tl">Total</span>
      <span class="tv" id="cart-total2">₹0.00</span>
    </div>
    <div style="padding: 14px 16px;">
      <button class="btn-main" style="margin-top:0" onclick="go('order')">Choose Pickup Slot →</button>
    </div>
  </div>

  <!-- ================= ORDER + PAYMENT ================= -->
  <div class="view" id="view-order">
    <div class="topbar">
      <button class="back" onclick="go('cart')">‹</button>
      <h2>Checkout</h2>
    </div>
    <div class="slot-day">① Pick your pickup time</div>
    <div class="slots-wrap" id="slots"></div>
    <div id="pay-slot"></div>
    <div class="success-card" id="success" style="display:none">
      <div class="tick">✓</div>
      <h3>Payment done!</h3>
      <div class="oid" id="succ-oid"></div>
      <p>Show this QR at the counter during your pickup slot</p>
      <div id="qr-box"></div>
      <button class="btn-done" onclick="go('history')">View My Orders</button>
    </div>
  </div>

  <!-- ================= HISTORY ================= -->
  <div class="view" id="view-history">
    <div class="topbar">
      <button class="back" onclick="go('home')">‹</button>
      <h2>Order History</h2>
      <button class="mini" style="color:var(--primary);font-weight:800" onclick="loadOrders()">↻</button>
    </div>
    <div id="orders-list"></div>
  </div>

  <div class="loader" id="loader"><div class="spinner"></div></div>
</div>
<div id="toast"></div>

<script>
// ===========================================================================
// HappyMunch Employee Web App
// Flow: login → vendors → menu → cart → pickup slot → create order (online
// payment only) → pay via UPI deep link (GPay · PhonePe · Paytm) → confirm →
// QR. Cash on delivery is not offered — every order is paid online.
// ===========================================================================
const API = "https://backend-production-acdc.up.railway.app";

const state = {
  user: null,
  accessToken: localStorage.getItem("hm_access") || null,
  refreshToken: localStorage.getItem("hm_refresh") || null,
  vendors: [], vendor: null, menu: [],
  cart: [], cartVendorId: null,
  slots: [], slot: null,
  pendingOrder: null,   // order awaiting UPI payment confirmation
};

const $ = (id) => document.getElementById(id);
const money = (cents) => "₹" + ((cents || 0) / 100).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const VENDOR_EMOJIS = ["🍜","🥘","🥪","🥗","🍛","🍰","☕","🧁"];
const vendorEmoji = (v) => VENDOR_EMOJIS[Math.abs(String(v.id || v.name).split("").reduce((a,c)=>a+c.charCodeAt(0),0)) % VENDOR_EMOJIS.length];

// --------------------------- API helpers -----------------------------------
function unwrap(res) {
  if (res && res.success === true && res.data !== undefined) return res.data;
  return res;
}

async function request(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (state.accessToken) headers.Authorization = "Bearer " + state.accessToken;
  let res = await fetch(API + path, { ...options, headers });
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (res.status === 401 && state.refreshToken && !options._retried) {
    const ok = await tryRefresh();
    if (ok) return request(path, { ...options, _retried: true });
    logoutToLogin();
  }
  if (!res.ok) {
    const err = new Error((body && (body.error || body.message)) || ("Request failed (" + res.status + ")"));
    err.status = res.status; throw err;
  }
  return unwrap(body);
}

async function tryRefresh() {
  try {
    const res = await fetch(API + "/api/auth/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refreshToken: state.refreshToken }),
    });
    if (!res.ok) return false;
    const data = unwrap(await res.json());
    state.accessToken = data.accessToken; state.refreshToken = data.refreshToken;
    localStorage.setItem("hm_access", data.accessToken);
    localStorage.setItem("hm_refresh", data.refreshToken);
    return true;
  } catch (_) { return false; }
}

// --------------------------- UI helpers ------------------------------------
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}
const loading = (on) => $("loader").classList.toggle("show", !!on);

function go(view) {
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
  $("view-" + view).classList.add("active");
  window.scrollTo(0, 0);
  if (view === "cart") renderCart();
  if (view === "history") loadOrders();
  if (view === "order") { state.pendingOrder = null; $("success").style.display = "none"; $("pay-slot").innerHTML = ""; loadSlots(); }
}

// --------------------------- Auth ------------------------------------------
async function doLogin() {
  const identifier = $("login-id").value.trim();
  const password = $("login-pw").value;
  const errBox = $("login-err"); errBox.style.display = "none";
  if (!identifier || !password) { errBox.textContent = "Enter Employee ID and password"; errBox.style.display = "block"; return; }
  $("login-btn").disabled = true; $("login-btn").textContent = "Signing in...";
  loading(true);
  try {
    const data = await request("/api/auth/login", { method: "POST", body: JSON.stringify({ identifier, password }) });
    if (data.user && data.user.role !== "employee") {
      throw new Error("This web app is for employees. Use the Vendor app or Admin dashboard for " + data.user.role + " accounts.");
    }
    state.user = data.user;
    state.accessToken = data.tokens.accessToken; state.refreshToken = data.tokens.refreshToken;
    localStorage.setItem("hm_user", JSON.stringify(data.user));
    localStorage.setItem("hm_access", data.tokens.accessToken);
    localStorage.setItem("hm_refresh", data.tokens.refreshToken);
    enterApp();
  } catch (e) {
    errBox.textContent = e.message || "Invalid Employee ID or password"; errBox.style.display = "block";
  } finally {
    loading(false); $("login-btn").disabled = false; $("login-btn").textContent = "Sign In";
  }
}

function logoutToLogin() {
  state.user = null; state.accessToken = null; state.refreshToken = null;
  ["hm_user","hm_access","hm_refresh"].forEach(k => localStorage.removeItem(k));
  go("login");
}
const logout = logoutToLogin;

function enterApp() {
  $("hello").textContent = "Hello, " + (state.user.employee_id || state.user.email || "there");
  go("home"); loadVendors();
}

// --------------------------- Vendors ---------------------------------------
async function loadVendors(silent) {
  if (!silent) loading(true);
  try {
    const data = await request("/api/vendors");
    state.vendors = data.vendors || [];
    renderVendors();
  } catch (e) { toast("Could not load vendors: " + e.message); }
  finally { loading(false); }
}

function renderVendors() {
  const el = $("vendors-list");
  if (!state.vendors.length) {
    el.innerHTML = '<div class="empty"><span class="big">🍽️</span>No vendors available yet.</div>'; return;
  }
  el.innerHTML = state.vendors.map((v, i) => `
    <div class="vendor-card" onclick="openVendor(${i})">
      <div class="vendor-emoji">${vendorEmoji(v)}</div>
      <div class="vendor-info">
        <b>${esc(v.vendor_name || v.name)}</b>
        <span>${esc(v.counter_location || "")}</span><br/>
        <span class="badge-ok">Approved · UPI accepted</span>
      </div>
      <div class="go">›</div>
    </div>`).join("");
}

function openVendor(i) {
  state.vendor = state.vendors[i];
  $("menu-vendor-name").textContent = state.vendor.vendor_name || state.vendor.name;
  $("menu-vendor-loc").textContent = state.vendor.counter_location || "";
  go("menu"); loadMenu();
}

// --------------------------- Menu ------------------------------------------
async function loadMenu() {
  const grid = $("menu-grid");
  grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="spinner"></div></div>';
  try {
    const data = await request("/api/vendors/" + state.vendor.id + "/menu");
    state.menu = data.menu_items || [];
    renderMenu();
  } catch (e) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="big">😕</span>Could not load menu.<br>' + esc(e.message) + '</div>';
  }
}

function renderMenu() {
  const grid = $("menu-grid");
  if (!state.menu.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="big">📭</span>This vendor has no menu items yet.</div>'; return;
  }
  grid.innerHTML = state.menu.map((it) => `
    <div class="food-card ${it.is_available === false ? "unavail" : ""}">
      <div class="food-img">${it.image_url ? '<img src="' + esc(it.image_url) + '" style="width:100%;height:100%;object-fit:cover" alt="">' : "🍽️"}</div>
      <div class="food-body">
        <b>${esc(it.name)}</b>
        <div class="fdesc">${esc(it.description || "")}</div>
        <div class="food-row">
          <span class="price">${money(it.price_cents)}</span>
          <button class="add-btn" onclick="addToCart('${it.id}')">+</button>
        </div>
      </div>
    </div>`).join("");
}

// --------------------------- Cart ------------------------------------------
function addToCart(itemId) {
  const item = state.menu.find((m) => m.id === itemId);
  if (!item || item.is_available === false) { toast("This item is currently unavailable"); return; }
  const vid = state.vendor.id;
  let base = state.cartVendorId === vid ? state.cart : [];
  const existing = base.find((c) => c.id === itemId);
  if (existing) existing.quantity += 1;
  else base = [...base, { id: item.id, name: item.name, price_cents: item.price_cents, quantity: 1, vendor_id: vid }];
  state.cart = base; state.cartVendorId = vid;
  toast(item.name + " added to cart"); updateCartBar();
}

function changeQty(id, delta) {
  const c = state.cart.find((x) => x.id === id); if (!c) return;
  c.quantity += delta;
  if (c.quantity <= 0) state.cart = state.cart.filter((x) => x.id !== id);
  if (!state.cart.length) state.cartVendorId = null;
  renderCart(); updateCartBar();
}
const removeFromCart = (id) => { state.cart = state.cart.filter((x) => x.id !== id); if (!state.cart.length) state.cartVendorId = null; renderCart(); updateCartBar(); };
const cartTotal = () => state.cart.reduce((s, i) => s + i.price_cents * i.quantity, 0);
const cartCount = () => state.cart.reduce((s, i) => s + i.quantity, 0);

function updateCartBar() {
  const bar = $("cart-bar"); const n = cartCount();
  bar.classList.toggle("show", n > 0);
  $("cart-count").textContent = n;
  $("cart-total").textContent = money(cartTotal());
}

function renderCart() {
  const list = $("cart-list");
  $("cart-item-n").textContent = state.cart.length + " item(s)";
  $("cart-total2").textContent = money(cartTotal());
  if (!state.cart.length) {
    list.innerHTML = '<div class="empty"><span class="big">🛒</span>Your cart is empty.<br>Browse a vendor and add items.</div>'; return;
  }
  list.innerHTML = state.cart.map((c) => `
    <div class="cart-row">
      <div class="ci">
        <b>${esc(c.name)}</b>
        <div class="qty-box">
          <button onclick="changeQty('${c.id}',-1)">−</button>
          <span>${c.quantity}</span>
          <button onclick="changeQty('${c.id}',1)">+</button>
        </div>
      </div>
      <span class="cart-price">${money(c.price_cents * c.quantity)}</span>
      <button class="rm-btn" onclick="removeFromCart('${c.id}')">Remove</button>
    </div>`).join("");
}

// --------------------------- Slots -----------------------------------------
async function loadSlots() {
  const el = $("slots");
  el.innerHTML = '<div class="spinner" style="margin:14px auto"></div>';
  try {
    const data = await request("/api/pickup-slots");
    const now = new Date();
    state.slots = (data.slots || []).filter((s) => new Date(s.slot_start) >= now).slice(0, 15);
    state.slot = null; renderSlots();
  } catch (e) { el.innerHTML = '<div class="empty">Could not load pickup slots.</div>'; toast(e.message); }
}

function renderSlots() {
  const el = $("slots");
  if (!state.slots.length) { el.innerHTML = '<div class="empty">No upcoming pickup slots.</div>'; return; }
  el.innerHTML = state.slots.map((s, i) => {
    const full = s.orders_booked >= s.max_orders;
    const d = new Date(s.slot_start);
    return `<div class="slot ${state.slot && state.slot.id === s.id ? "sel" : ""} ${full ? "full" : ""}" onclick="pickSlot(${i})">
      <b>${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</b>
      <span>${d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}</span>
      <span style="display:block;margin-top:2px">${full ? "Full" : s.orders_booked + "/" + s.max_orders + " booked"}</span>
    </div>`;
  }).join("");
}

function pickSlot(i) {
  const s = state.slots[i];
  if (s.orders_booked >= s.max_orders) { toast("That slot is full — pick another"); return; }
  state.slot = s; renderSlots(); renderPayStep();
}

// --------------------------- Payment (UPI only) ----------------------------
// Builds a UPI deep link that opens GPay / PhonePe / Paytm directly with the
// vendor's payee (UPI ID or phone number) and the amount pre-filled.
function upiLink(app) {
  const v = state.vendor || {};
  // Prefer the vendor's UPI ID; fall back to their payment phone number.
  const payee = (v.upi_id && String(v.upi_id).includes("@"))
    ? v.upi_id
    : (v.payment_phone || v.mobile || "");
  const amt = (state.pendingOrder ? state.pendingOrder.total_cents : cartTotal()) / 100;
  const note = state.pendingOrder ? state.pendingOrder.order_number : "HappyMunch order";
  const payeeName = v.vendor_name || v.name || "HappyMunch Vendor";
  const q = "pa=" + encodeURIComponent(payee) +
    "&pn=" + encodeURIComponent(payeeName) +
    "&am=" + amt.toFixed(2) + "&cu=INR" +
    "&tn=" + encodeURIComponent(note);
  const links = {
    gpay:     "tez://upi/pay?" + q,                 // Google Pay
    phonepe:  "phonepe://pay?" + q,                 // PhonePe
    paytm:    "paytmmp://pay?" + q,                 // Paytm
    more:     "upi://pay?" + q,                     // generic UPI chooser
  };
  return links[app] || links.more;
}

function openUpi(app) {
  const link = upiLink(app);
  // On Android this launches the app; on desktop it may do nothing, so we
  // also reveal the QR + payee as a fallback.
  window.location.href = link;
  toast("Opening " + ({ gpay: "GPay", phonepe: "PhonePe", paytm: "Paytm", more: "UPI app" })[app] + "… complete the payment, then tap \"I've paid\"");
}

function renderPayStep() {
  if (!state.slot) return;
  const v = state.vendor || {};
  const payee = (v.upi_id && String(v.upi_id).includes("@")) ? v.upi_id : (v.payment_phone || v.mobile || "not set");
  const amt = (cartTotal() / 100).toFixed(2);
  const slotTime = new Date(state.slot.slot_start).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" });
  $("pay-slot").innerHTML = `
    <div class="slot-day">② Pay online to confirm your order</div>
    <div class="pay-sheet">
      <div class="pay-head">
        <div class="amt">₹${amt}</div>
        <div class="who">to ${esc(v.vendor_name || v.name || "Vendor")} · pickup ${esc(slotTime)}</div>
      </div>
      <div class="pay-body">
        <div class="pay-note">Pay online with UPI — <b>no cash on delivery</b>. Tap an app below to pay, then confirm. Your order is sent to the kitchen once payment is done.</div>
        <div class="pay-to">
          <div class="pt-ico">💳</div>
          <div><b>Payee</b><span>${esc(payee)}</span></div>
        </div>
        <div class="pay-apps">
          <button class="pay-app pa-gpay" onclick="openUpi('gpay')"><span class="ico">🅶</span>GPay</button>
          <button class="pay-app pa-phonepe" onclick="openUpi('phonepe')"><span class="ico">📱</span>PhonePe</button>
          <button class="pay-app pa-paytm" onclick="openUpi('paytm')"><span class="ico">🅿️</span>Paytm</button>
          <button class="pay-app pa-more" onclick="openUpi('more')">_more UPI apps_</button>
        </div>
        <div class="pay-qr">
          <div class="qrbox" id="upi-qr"></div>
          <p>Or scan with any UPI app</p>
        </div>
        <button class="paid-btn" onclick="placeOrderPaid()">✓ I've paid — place my order</button>
        <a class="cancel-link" href="#" onclick="return false">Having trouble? Use any UPI app to scan the code above.</a>
      </div>
    </div>`;
  // Render a UPI QR so desktop users can scan-to-pay with any app.
  const qrBox = $("upi-qr");
  if (window.QRCode && qrBox) {
    new QRCode(qrBox, { text: upiLink("more").replace("upi://", "upi://"), width: 150, height: 150, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  }
}

// Creates the order, then confirms the UPI payment. Online payment only —
// there is no cash-on-delivery path.
async function placeOrderPaid() {
  if (!state.cart.length) { toast("Add items to cart first"); go("menu"); return; }
  if (!state.slot) { toast("Choose a pickup time"); return; }
  loading(true);
  try {
    // 1) create the order (pending payment)
    const data = await request("/api/orders", {
      method: "POST",
      body: JSON.stringify({
        vendor_id: state.cartVendorId,
        items: state.cart.map((i) => ({ menu_item_id: i.id, quantity: i.quantity })),
        pickup_slot_id: state.slot.id,
        notes: $("order-notes") ? $("order-notes").value.trim() : "",
        payment_method: "upi",
      }),
    });
    const order = data.order;
    // 2) confirm the UPI payment (marks paid + confirmed)
    try {
      await request("/api/orders/" + order.id + "/pay-upi", { method: "POST", body: JSON.stringify({ upi_transaction_ref: null }) });
    } catch (_) { /* confirmation is best-effort; order still exists */ }
    state.pendingOrder = order;
    state.cart = []; state.cartVendorId = null;
    const notesEl = $("order-notes"); if (notesEl) notesEl.value = "";
    updateCartBar();
    showSuccess(order);
  } catch (e) { toast("Order failed: " + e.message); }
  finally { loading(false); }
}

function showSuccess(order) {
  $("pay-slot").innerHTML = "";
  $("succ-oid").textContent = "Order #" + order.order_number;
  $("success").style.display = "block";
  const qrBox = $("qr-box"); qrBox.innerHTML = "";
  const payload = order.qr_code_payload || order.order_number;
  if (window.QRCode) new QRCode(qrBox, { text: payload, width: 172, height: 172, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  else qrBox.innerHTML = '<div style="font-weight:900;font-size:18px">' + esc(order.order_number) + '</div>';
  $("success").scrollIntoView({ behavior: "smooth" });
  toast("Payment successful · Order #" + order.order_number);
}

// --------------------------- History ---------------------------------------
const STATUS_COLORS = {
  collected: ["#d1fae5", "#065f46"], ready_for_pickup: ["#dbeafe", "#1e40af"],
  preparing: ["#fef3c7", "#92400e"], confirmed: ["#e0e7ff", "#3730a3"],
  accepted: ["#e0e7ff", "#3730a3"],
  cancelled: ["#fee2e2", "#991b1b"], refunded: ["#f3e8ff", "#6b21a8"],
  payment_failed: ["#fee2e2", "#991b1b"], pending_payment: ["#f1f5f9", "#334155"],
};

async function loadOrders() {
  const list = $("orders-list");
  list.innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  try {
    const data = await request("/api/orders/my");
    const orders = data.orders || [];
    if (!orders.length) {
      list.innerHTML = '<div class="empty"><span class="big">🧾</span>No orders yet.<br>Your orders will show up here.</div>'; return;
    }
    list.innerHTML = orders.map((o) => {
      const [bg, fg] = STATUS_COLORS[o.status] || ["#f1f5f9", "#334155"];
      const when = o.pickup_slot_start ? new Date(o.pickup_slot_start) : (o.created_at ? new Date(o.created_at) : null);
      const paid = o.payment_status === "paid";
      return `<div class="order-card">
        <div class="oc">
          <b>#${esc(o.order_number)}</b>
          <span>${esc(o.vendor_name || "")}</span>
          ${when ? "<em>Pickup " + when.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit", day: "numeric", month: "short" }) + "</em>" : ""}
          ${paid ? '<span class="paid-tag">✓ Paid via UPI</span>' : ""}
        </div>
        <div style="text-align:right">
          <div class="status-pill" style="background:${bg};color:${fg}">${esc(String(o.status).replace(/_/g, " "))}</div>
          <b style="display:block;margin-top:7px;color:var(--primary)">${money(o.total_cents)}</b>
        </div>
      </div>`;
    }).join("");
  } catch (e) { list.innerHTML = '<div class="empty"><span class="big">😕</span>Could not load orders.</div>'; }
}

// --------------------------- Boot ------------------------------------------
(function boot() {
  const saved = localStorage.getItem("hm_user");
  if (saved && state.accessToken) {
    try { state.user = JSON.parse(saved); enterApp(); return; } catch (_) {}
  }
  go("login");
})();

["login-pw","login-id"].forEach(id => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); }));
</script>
